dev_dependencies:
  auto_route_generator: ^9.0.0 #Can't update it to 9.3.1, because auto_route_generator >=9.3.0 depends on source_gen ^2.0.0, injectable_generator ^2.6.2 is incompatible with auto_route_generator >=9.3.0.
  build_resolvers: ^2.4.3
  build_runner: ^2.4.14
  flutter_gen_runner: ^5.8.0
  flutter_native_splash: ^2.4.4
  import_sorter: 4.6.0
  injectable_generator: ^2.6.2 #Can't update it, Because injectable_generator >=2.7.0 depends on dart_style ^3.0.1 and flutter_gen_core 5.8.0 depends on dart_style ^2.2.4
  json_serializable: ^6.9.0 #Can't update it, because injectable_generator ^2.6.2 is incompatible with json_serializable >=6.9.1.
  lint: ^2.3.0
  retrofit_generator: ^9.1.7
  very_good_analysis: ^7.0.0


flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/tab/
    - assets/images/
    - assets/logos/
    - assets/icons/
    - assets/badges/
    - assets/rank/
    - assets/anim/

  fonts:
  - family: Karla
    fonts:
      - asset: fonts/Karla-Regular.ttf
      - asset: fonts/Karla-Bold.ttf
        weight: 700
  - family: SnobsIcons
    fonts:
    - asset: fonts/icons/SnobsIcons.ttf
  - family: NunitoSans
    fonts:
      - asset: fonts/NunitoSans.ttf
        weight: 400
      - asset: fonts/NunitoSans-Bold.ttf
        weight: 700
      - asset: fonts/NunitoSans-ExtraBold.ttf
        weight: 800

